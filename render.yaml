# =========================================================================
# Render Blueprint Specification (Infrastructure-as-Code for Render)
# =========================================================================
# Deploys:
#   1. atelier-postgres (Free Tier PostgreSQL Database)
#   2. atelier-backend  (Free Tier Spring Boot 3.3.5 / Java 21 Web Service)
# =========================================================================

databases:
  - name: atelier-postgres
    plan: free
    databaseName: atelier_db
    user: atelier_user
    region: oregon

services:
  - type: web
    name: atelier-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Automatically wires Render Postgres connection string
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-postgres
          property: connectionString
      # Generates a secure random 256-bit token for HMAC-SHA256 JWT
      - key: ATELIER_JWT_SECRET
        generateValue: true
      - key: ATELIER_SUPERADMIN_EMAIL
        value: admin@atelier.local
      - key: ATELIER_SUPERADMIN_PASSWORD
        sync: false
      - key: ATELIER_CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        value: atelier-ar-bucket
      - key: ATELIER_MAX_PUBLISHED_MODEL_BYTES
        value: "26214400"
