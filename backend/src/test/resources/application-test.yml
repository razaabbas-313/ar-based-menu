# Used by @ActiveProfiles("test") slice tests.
spring:
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

atelier:
  jwt:
    secret: test-only-jwt-secret-for-unit-tests-0123456789abcdef
  cors:
    allowed-origins: http://localhost:5173
  scheduling:
    enabled: false

aws:
  s3:
    bucket: atelier-test-bucket
