# Copy this file to secrets.properties (same folder, git-ignored) and fill in your values.
# Spring Boot loads it automatically (spring.config.import in application.yml).
# Environment variables with the same names still win over this file.

# --- AWS S3 (real bucket) ---
AWS_REGION=ap-south-1
AWS_S3_BUCKET=atelier-ar-bucket
AWS_ACCESS_KEY_ID=
AWS_SECRET_ACCESS_KEY=
# Optional CloudFront / public base URL
AWS_S3_PUBLIC_BASE_URL=

# --- JWT signing key (required outside the 'local' profile; >= 32 random bytes) ---
# node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
ATELIER_JWT_SECRET=

# --- Super admin (/admin) ---
ATELIER_SUPERADMIN_EMAIL=admin@atelier.local
# Leave blank to have a random password generated and printed once in the log on first start.
ATELIER_SUPERADMIN_PASSWORD=
# true = re-apply ATELIER_SUPERADMIN_PASSWORD on every start (account recovery), then set back to false
ATELIER_SUPERADMIN_RESET=false
